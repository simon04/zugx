# Bildfahrplan sheets (corridors) of Spain, along the ADIF lines (OSM ref, packages/vzg/data/es):
# the high-speed corridors from Madrid, the Mediterranean corridor and one Cercanías trunk. Anchors:
# stop ids of the Renfe feeds (ADIF station codes) in corridor order (stations of the sheet between
# them are found from the trains); see CorridorDef in src/corridors.ts.

[[corridors]]
id = "es-050"
name = "Madrid – Zaragoza – Barcelona – Figueres (LAV)"
anchors = [
  "60000", # Madrid-Puerta de Atocha-Almudena Grandes
  "04007", # Guadalajara-Yebes
  "70600", # Calatayud
  "04040", # Zaragoza Delicias
  "78400", # Lleida-Pirineus
  "04104", # Camp de Tarragona
  "71801", # Barcelona-Sants
  "79300", # Girona
  "04307", # Figueres-Vilafant
]
# the high-speed line has no stations between the anchors: the conventional lines' stations
# (Jalón valley, Huesca – Monzón, Granollers) belong to their own lines
nonstop = ["60000", "04007", "70600", "04040", "78400", "04104", "71801", "79300"]

