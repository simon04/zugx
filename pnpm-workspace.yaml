packages:
  - apps/*
  - packages/*
  - e2e

catalogMode: prefer

catalog:
  "@types/node": ^26
  fflate: ^0.8.3
  typescript: ^7.0.2
  vite-plus: ^1.8.0
  vite: npm:@voidzero-dev/vite-plus-core@^8.3.8001
  maplibre-gl: ^6.19.0
  vue: ^3.5.46
  vue-router: ^5.5.1
  "@unocss/preset-wind4": ^66.13.0
  "@vitejs/plugin-vue": ^6.0.11
  unocss: ^66.13.0
  vite-plugin-pwa: ^2.0.0
  vue-tsc: ^3.3.14
  "@types/geojson": ^7946.0.16
  "@playwright/test": ^1.65.1
  "@vueuse/core": ^15.1.0
  temporal-polyfill: 1.0.8
  smol-toml: ^1.9.1
  pbf: ^5.2.0
  "@zugx/toml": workspace:*
  workbox-window: ^7.4.1
  # node-gtfs: GTFS → SQLite (packages/db); pinned
  gtfs: 4.21.1
  # minotor: client-side transit routing (RAPTOR) on GTFS — timetable search without live data
  minotor: ^13.0.1

overrides:
  vite@*: "catalog:"

# native builds allowed (node-gtfs → better-sqlite3)
onlyBuiltDependencies:
  - better-sqlite3
